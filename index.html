<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Simple Games</title>
	<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
	<style>
		:root{--ink:#25324a;--purple:#7257d9;--yellow:#ffd166;--mint:#b8f2d0;--pink:#ff9fbb;--blue:#8ed8ff}
		*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:#fff8ed}
		header{height:100px;background:var(--purple);color:white;display:flex;align-items:center;padding:0 6%;box-shadow:0 5px 0 #5941bb}
		header h1{margin:0;font-size:clamp(2rem,5vw,3.4rem);letter-spacing:.5px} header span{font-size:2rem;margin-right:14px}
		.layout{display:grid;grid-template-columns:265px 1fr;min-height:calc(100vh - 100px);max-width:1400px;margin:auto}
		aside{background:#fff0c8;padding:34px 22px;border-right:3px solid #f5d98c} aside h2{margin:0 0 22px;font-size:1.35rem}
		.game-link{width:100%;border:0;border-radius:16px;padding:16px;text-align:left;background:transparent;color:var(--ink);font-weight:bold;font-size:1rem;cursor:pointer;margin:5px 0;transition:.2s}
		.game-link:hover,.game-link.active{background:white;box-shadow:0 4px 0 #e7cb82;transform:translateY(-1px)} .game-link span{font-size:1.5rem;margin-right:10px;vertical-align:middle}
		main{padding:48px 7%;text-align:center}.intro{max-width:650px;margin:0 auto 30px}.intro h2{font-size:2rem;margin:0 0 8px}.intro p{font-size:1.1rem;margin:0;color:#59657a}
		.card{background:white;border-radius:28px;padding:28px;max-width:530px;margin:auto;box-shadow:0 8px 0 #e9e0d0}.status{font-weight:bold;font-size:1.2rem;margin-bottom:20px}
		.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:auto}.cell{aspect-ratio:1;border:0;border-radius:18px;background:var(--mint);font-size:clamp(2.5rem,10vw,4.5rem);font-weight:bold;color:var(--purple);cursor:pointer;box-shadow:inset 0 -5px 0 #8bd2ae}.cell:nth-child(3n+2){background:var(--blue);box-shadow:inset 0 -5px 0 #68b9e2}.cell:nth-child(3n){background:var(--pink);box-shadow:inset 0 -5px 0 #e77f9e}.cell:disabled{cursor:default;opacity:.9}.reset{margin-top:25px;border:0;border-radius:14px;padding:13px 25px;background:var(--yellow);color:var(--ink);font-weight:bold;font-size:1rem;cursor:pointer}
		.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:var(--ink);color:white;padding:15px 22px;border-radius:14px;font-weight:bold;box-shadow:0 4px 0 #111b2d;z-index:3}
		@media(max-width:1200px){main{padding:42px 5%}} @media(max-width:1080px){.layout{grid-template-columns:230px 1fr}}
		@media(max-width:800px){header{height:82px}.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:3px solid #f5d98c;padding:15px 18px;display:flex;align-items:center;gap:8px;overflow-x:auto}aside h2{display:none}.game-link{min-width:145px;margin:0}}
		@media(max-width:600px){main{padding:30px 16px}.card{padding:20px 14px;border-radius:22px}.intro h2{font-size:1.7rem}}
		@media(max-width:480px){header{height:72px;padding:0 20px}header span{font-size:1.5rem}.board{gap:7px}.cell{border-radius:12px}.intro p{font-size:1rem}}
	</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
	const {useState}=React;
	function TicTacToe(){const [board,setBoard]=useState(Array(9).fill(''));const [turn,setTurn]=useState('X');const [winner,setWinner]=useState('');
		const win=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
		function play(i){if(board[i]||winner)return;const next=[...board];next[i]=turn;const won=win.some(a=>a.every(x=>next[x]===turn));setBoard(next);if(won)setWinner(turn+' wins!');else if(next.every(Boolean))setWinner("It's a draw!");else setTurn(turn==='X'?'O':'X')}
		return <div className="card"><div className="status">{winner||`Player ${turn}'s turn`}</div><div className="board">{board.map((v,i)=><button className="cell" key={i} onClick={()=>play(i)} disabled={!!v||!!winner}>{v}</button>)}</div><button className="reset" onClick={()=>{setBoard(Array(9).fill(''));setTurn('X');setWinner('')}}>New game</button></div>}
	function App(){const [game,setGame]=useState('Tic-Tac-Toe');const [toast,setToast]=useState('');function choose(g){setGame(g);if(g!=='Tic-Tac-Toe'){setToast(g+' is not implemented yet!');setTimeout(()=>setToast(''),2500)}}return <><header><span>🎮</span><h1>Simple Games</h1></header><div className="layout"><aside><h2>Game types</h2>{[['Tic-Tac-Toe','⭕'],['Sudoku','🔢'],['Connect Four','🔴']].map(([name,icon])=><button className={'game-link '+(game===name?'active':'')} onClick={()=>choose(name)} key={name}><span>{icon}</span>{name}</button>)}</aside><main><div className="intro"><h2>{game}</h2><p>Pick a square and make three in a row. Have fun!</p></div>{game==='Tic-Tac-Toe'?<TicTacToe/>:<div className="card"><div style={{fontSize:'4rem'}}>🚧</div><h2>Coming soon!</h2><p>This game is not implemented yet. Choose Tic-Tac-Toe to play.</p></div>}</main></div>{toast&&<div className="toast">✨ {toast}</div>}</>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
